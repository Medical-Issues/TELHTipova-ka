<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Registrace – Tipovačka</title>
    <link rel="stylesheet" href="/css/modern-design.css" />
    <link rel="icon" href="/images/logo.png">
</head>
<body class="login_body">
<div class="login-container">
    <img class="login-logo" src="/images/logo.png" alt="Logo">
    <h1>Registrace</h1>
    <p class="login-subtitle">Vytvořte si účet a zapojte se do tipovací soutěže.</p>
    <form class="login_form" method="POST" action="/auth/register">
        <input type="hidden" name="_csrf" id="csrfToken" value="">
        <div class="input-group">
            <label class="input-label" for="reg-username">Uživatelské jméno</label>
            <input class="login_input" id="reg-username" type="text" name="username" placeholder="Vyberte si přezdívku" required autocomplete="username">
        </div>
        <div class="input-group">
            <label class="input-label" for="reg-password">Heslo</label>
            <input class="login_input" id="reg-password" type="password" name="password" placeholder="Bezpečné heslo" required autocomplete="new-password">
        </div>
        <button class="login_button" type="submit">Zaregistrovat se ➔</button>
    </form>
    <p id="error-msg">Uživatel už existuje.</p>
    <div class="auth-switch">
        Už máte účet? <a href="/auth/login">Přihlaste se</a>
    </div>
</div>

<script src="/js/version-notification.js"></script>
<script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('error') === '1') {
        document.getElementById('error-msg').style.display = 'block';
    }
</script>
</body>
</html>
